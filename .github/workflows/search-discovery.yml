name: Notify search engines

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "404.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-discovery-main
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Wait for current production deployment
        shell: bash
        run: |
          for attempt in {1..24}; do
            status=$(curl --silent --output /dev/null --write-out "%{http_code}" https://felixkeuya.com/ || true)
            if [ "$status" = "200" ]; then
              curl --fail --silent --show-error \
                https://felixkeuya.com/sitemap.xml \
                --output /tmp/production-sitemap.xml || true

              if [ -s /tmp/production-sitemap.xml ] && cmp -s sitemap.xml /tmp/production-sitemap.xml; then
                echo "Current production deployment is live on felixkeuya.com."
                exit 0
              fi
            fi
            echo "Attempt $attempt: waiting for the current production deployment."
            sleep 10
          done
          echo "Current production sitemap was not live within the wait period."
          exit 1

      - name: Build IndexNow payload from sitemap
        shell: bash
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          root = ET.parse("sitemap.xml").getroot()
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall("sm:url/sm:loc", namespace) if node.text]
          payload = {
              "host": "felixkeuya.com",
              "key": "7466da5f4210c73cef578955ef7f5a42",
              "keyLocation": "https://felixkeuya.com/7466da5f4210c73cef578955ef7f5a42.txt",
              "urlList": urls,
          }
          with open("/tmp/indexnow.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          print(f"Prepared {len(urls)} canonical URLs for IndexNow.")
          PY

      - name: Notify IndexNow search engines
        shell: bash
        run: |
          code=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --output /tmp/indexnow-response.txt --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow)
          cat /tmp/indexnow-response.txt || true
          echo "IndexNow HTTP status: $code"
          case "$code" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Notify WebSub hub
        shell: bash
        run: |
          code=$(curl --silent --show-error --retry 2 --retry-all-errors \
            --output /tmp/websub-response.txt --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "hub.mode=publish" \
            --data-urlencode "hub.url=https://felixkeuya.com/feed.xml" \
            https://pubsubhubbub.appspot.com/ || true)
          echo "WebSub HTTP status: ${code:-unavailable}"
          if [ -s /tmp/websub-response.txt ]; then cat /tmp/websub-response.txt; fi
          case "$code" in
            200|202|204) echo "WebSub notification accepted." ;;
            *) echo "WebSub is optional; continuing without failing the workflow." ;;
          esac

      - name: Search discovery summary
        shell: bash
        run: |
          echo "Production is current on felixkeuya.com, sitemap is live, and IndexNow accepted the URL submission."
